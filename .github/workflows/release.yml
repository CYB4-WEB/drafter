name: Release APK

# Every push to main: if there is no GitHub Release yet for the app's versionName (app/build.gradle.kts → tag vX.Y),
# GitHub builds the release APKs and publishes them. Also runs on a pushed tag v* or manually.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KS: ${{ secrets.DAFTAR_KEYSTORE_BASE64 }}
      # Certificate every Daftar release has been signed with since 1.1 — never change it, or updates stop installing.
      DAFTAR_CERT_SHA256: fa87e2908e974bbcf8446a86cd634c891b690e4fc5d9043e194025410b5dd392
    steps:
      - uses: actions/checkout@v4
      - name: Decide tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"
          else TAG="v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -z "$KS" ]; then
            echo "::warning::Secret DAFTAR_KEYSTORE_BASE64 is not set — skipping: without the original signing key the APK would not update over the installed app."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK packages (runner already has the Android SDK)
        if: steps.ver.outputs.skip != 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        if: steps.ver.outputs.skip != 'true'
      - name: Signing key from secrets (required, so the APK updates over the installed version)
        if: steps.ver.outputs.skip != 'true'
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DAFTAR_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "DAFTAR_KEYSTORE_PASSWORD=${{ secrets.DAFTAR_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "DAFTAR_KEY_ALIAS=${{ secrets.DAFTAR_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "DAFTAR_KEY_PASSWORD=${{ secrets.DAFTAR_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build release APKs
        if: steps.ver.outputs.skip != 'true'
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify signing key (must match the key of 1.1 / 2.0 / 3.0 so updates install over them)
        if: steps.ver.outputs.skip != 'true'
        run: |
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for a in app/build/outputs/apk/release/*.apk; do
            "$SIGNER" verify --print-certs "$a" | grep -q "SHA-256 digest: $DAFTAR_CERT_SHA256" \
              || { echo "::error::$a is not signed with the Daftar key ($DAFTAR_CERT_SHA256) — refusing to publish."; exit 1; }
          done
      - name: Package
        if: steps.ver.outputs.skip != 'true'
        id: pkg
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          V="${TAG#v}"
          mkdir out
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "out/Daftar-$V-tablet-arm64.apk"
          cp app/build/outputs/apk/release/app-x86_64-release.apk "out/Daftar-$V-emulator-x86_64.apk"
          (cd out && zip -9 "Daftar-$V-tablet-arm64.zip" "Daftar-$V-tablet-arm64.apk" && zip -9 "Daftar-$V-emulator-x86_64.zip" "Daftar-$V-emulator-x86_64.apk")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: Daftar ${{ steps.pkg.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            **Install on the Galaxy Tab S11 Ultra:** `Daftar-${{ steps.pkg.outputs.version }}-tablet-arm64.apk`
            **Android Studio emulator:** `Daftar-${{ steps.pkg.outputs.version }}-emulator-x86_64.apk`
            The .zip files contain the same APKs (smaller download).
          files: out/*
