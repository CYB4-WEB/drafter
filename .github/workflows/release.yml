name: Release APK

# Push a tag like v3.0 (or run manually) → GitHub builds the release APKs and publishes them as a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key from secrets (optional)
        if: ${{ env.KS != '' }}
        env:
          KS: ${{ secrets.DAFTAR_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DAFTAR_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "DAFTAR_KEYSTORE_PASSWORD=${{ secrets.DAFTAR_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "DAFTAR_KEY_ALIAS=${{ secrets.DAFTAR_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "DAFTAR_KEY_PASSWORD=${{ secrets.DAFTAR_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build release APKs
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Package
        id: pkg
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          V="${TAG#v}"
          mkdir out
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "out/Daftar-$V-tablet-arm64.apk"
          cp app/build/outputs/apk/release/app-x86_64-release.apk "out/Daftar-$V-emulator-x86_64.apk"
          (cd out && zip -9 "Daftar-$V-tablet-arm64.zip" "Daftar-$V-tablet-arm64.apk" && zip -9 "Daftar-$V-emulator-x86_64.zip" "Daftar-$V-emulator-x86_64.apk")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: Daftar ${{ steps.pkg.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            **Install on the Galaxy Tab S11 Ultra:** `Daftar-${{ steps.pkg.outputs.version }}-tablet-arm64.apk`
            **Android Studio emulator:** `Daftar-${{ steps.pkg.outputs.version }}-emulator-x86_64.apk`
            The .zip files contain the same APKs (smaller download).
          files: out/*
